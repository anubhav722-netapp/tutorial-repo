# NetApp BlueXP Connector - GCP IAM Role
# 
# This file defines the custom IAM role with all permissions required
# for the NetApp BlueXP Connector to manage cloud resources.
#
# These permissions allow the Connector to:
# - Create and manage CVO instances
# - Manage storage (disks, snapshots, buckets)
# - Configure networking (firewalls, load balancers)
# - Access KMS for encryption
# - Use Infrastructure Manager for deployments

title: NetApp BlueXP Connector Role
description: Permissions for the service account associated with the NetApp BlueXP Connector
stage: GA
